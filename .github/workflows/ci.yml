name: CI

on:
  push:
    branches: [main]
    paths:
      - "apian-studio-new/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apian-studio-new/**"
      - ".github/workflows/ci.yml"

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apian-studio-new
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur (20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apian-studio-new/package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Tip kontrolü
        run: npx tsc --noEmit

      - name: Birim testleri
        run: npm run test

      - name: Production build
        run: npm run build
