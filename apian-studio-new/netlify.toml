# Apian Studio — Netlify (uygulama dizini: apian-studio-new/)
# Not: Git CD bağlanırken Netlify panelinde Base directory = apian-studio-new seçilmeli.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
