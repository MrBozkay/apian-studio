# Apian Studio — Netlify (uygulama dizini: apian-studio-new/)
# Not: Git CD bağlanırken Netlify panelinde Base directory = apian-studio-new seçilmeli.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Essential Next.js: SSR/route handler'ları Netlify Function'a çevirir.
# Açıkça sabitlendi; otomatik tespite bırakılınca Git build'inde
# plugin çalışmayıp ham .next yayınlanmıştı (404).
[[plugins]]
  package = "@netlify/plugin-nextjs"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
